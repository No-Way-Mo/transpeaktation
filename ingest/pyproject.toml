[project]
name = "transpeaktation-ingest"
version = "0.1.0"
description = "Ingest workers: pull city/road/event feeds and normalize them for Transpeaktation."
requires-python = ">=3.10"
dependencies = []  # pullers are stdlib-only; add DB drivers here when writers land.

[project.optional-dependencies]
osm = ["osmnx>=2,<3"]  # SF road graph (pull source: osm_drive_graph)
live = ["mapbox-vector-tile>=2"]  # decode TomTom traffic tiles (pull.poll)

[tool.setuptools]
packages = ["datasf", "pull"]

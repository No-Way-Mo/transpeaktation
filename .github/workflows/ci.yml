# Tests on every PR and push; a push to main that passes redeploys the DigitalOcean droplet (deploy/).
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip, cache-dependency-path: api/pyproject.toml }
      - run: pip install -e '.[test]'
      - run: python -m unittest discover -s tests -t .

  ingest:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ingest } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip, cache-dependency-path: ingest/pyproject.toml }
      - run: pip install -e '.[db,live]'
      - run: python -m unittest discover -s tests -t .

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env: { NEXT_PUBLIC_API_URL: 'http://localhost:8000' }
      - run: node demo/check.mjs
        working-directory: .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, ingest, web]
    runs-on: ubuntu-latest
    concurrency: { group: deploy, cancel-in-progress: false }
    env:
      HOST: 167.172.23.38
      HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILI6S25ba6+xQPvZoKWNWW+MNoqq8TuwsJ6snh3J8hzr
    steps:
      # DEPLOY_SSH_KEY can only run tp-redeploy (forced command on the droplet), nothing else.
      - env: { KEY: '${{ secrets.DEPLOY_SSH_KEY }}' }
        run: |
          mkdir -p ~/.ssh && echo "$HOST $HOST_KEY" > ~/.ssh/known_hosts
          echo "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes tp@$HOST
      - run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://167-172-23-38.sslip.io/api/health

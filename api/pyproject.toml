[project]
name = "transpeaktation-api"
version = "0.1.0"
description = "Places + traffic-aware routes (Mapbox, OSRM fallback) matched to OSM road segments (OSMnx)."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1",
  "osmnx>=2,<3",
]

[tool.setuptools]
packages = ["app"]

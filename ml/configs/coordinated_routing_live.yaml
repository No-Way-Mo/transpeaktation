# Deployed coordinator, LIVE input (ml/deploy/coordination_do.sh): customer requests pull the congestion map the
# forecaster writes to Tiger prediction_metrics (+ Mongo forecast_runs) from Tiger traffic_metrics and Mongo
# closures/events (forecast/live.py, coordination/live.py). Heuristic load balancer; batch (CP-SAT) per request.
# The forecaster was trained on synthetic SUMO traffic only. Settings are POC starting values, not tuned optima.
name: coordinated_routing_live
seed: 0
network:
  sim_root: data/sf_citywide
  network: net_v3
  segments: data/sf_citywide/batches/b3_verify/export/segments.parquet
  patch: data/sf_citywide/prepared/patch.json
  cache_dir: /var/lib/transpeaktation/coordination/network_cache
  max_snap_m: 75
forecast:
  bucket_min: 10
  horizons: 6                       # event_patch_v2_main: 6 x 10 min
  max_issue_age_min: 45            # ingest lags ~10-25 min; the map is issued at the newest complete bucket
candidates:
  k: 5
  max_searches: 12
  detour_abs_s: 180
  detour_rel: 0.15
ledger:
  bin_min: 5
  spread: [1.0]
  provisional_ttl_s: 60
score:
  lam: 60.0
batch:
  max_requests: 32
  max_wait_ms: 250
  solve_ms: 250
service:
  host: 0.0.0.0                     # token required (COORDINATION_API_TOKEN); firewall limits who can connect
  port: 8100
  selector: heuristic
  allowed_selectors: [forecast_only, heuristic, batch]
live:
  forecast_url: http://127.0.0.1:8200
  state_dir: /var/lib/transpeaktation/coordination
  check_s: 60
  retry_s: 30
  wait_s: 150

# Load-balancing backtest (LOAD_BALANCING_BACKTEST_PLAN.md): matched closed-loop SUMO comparison of independent
# forecast routing vs coordinated selectors on b3_main with the frozen event_patch_v2_main forecaster.
# Full config (the loader has no inheritance); derived from coordinated_routing_rl_main.yaml. Differences, fixed
# before any run: participant cap lifted (150 bound the 5% share: 200-330 eligible participants per scenario),
# drain cap 3600 s for every policy, own output folders, 1 worker by default (cloud nodes pass --workers).
name: coordinated_routing_backtest
seed: 0
network:
  segments: data/sf_citywide/batches/b3_main/export/segments.parquet
forecast:
  path: data/forecast/exports/b3_main_snapshot.parquet     # serving/route CLI only; episodes refresh their own
env:
  batch: b3_main
  splits: data/forecast/datasets/b3_main_v3net_ep2/splits.json   # test = portola, val = bearrison
  history_s: 3600
  decision_window_s: 1800
  max_drain_s: 3600
  participation: 0.05
  max_participants: 100000
  compliance: 1.0
  forecast_mode: model
  forecast_checkpoint: data/forecast/experiments/event_patch_v2_main/best.pt
  forecast_device: cpu
  warm_state_cache: true
  time_to_teleport_s: 300
  out_dir: data/coordination/backtest/episodes
rl:
  k: 5
  checkpoint: data/coordination/rl/runs_main/ppo_s0/best
  device: cpu
benchmark:
  policies: [forecast_only, heuristic, batch]
  checkpoints:
    rl_ppo: data/coordination/rl/runs_main/ppo_s0/best
    rl_ddqn: data/coordination/rl/runs_main/ddqn_s0/best
  screening_split: val
  screening_scenarios: 3
  heldout_split: test
  heldout_scenarios: 6
  seeds: [0, 1]
  batch_window_s: 60
  workers: 1
  out_dir: data/coordination/backtest

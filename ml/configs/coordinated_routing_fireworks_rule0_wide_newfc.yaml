# Same experiment as coordinated_routing_fireworks_rule0_wide.yaml with the new 3-hour forecaster (event_patch_x_all).
# SIMULATION_EXPERIMENT_STANDARD.md run of the demo experiment (section 10) under Rule 0: NO teleporting
# (time_to_teleport_s -1). Wide candidate search (detour <= min(300 s, 25%), 20 searches, K 5) for every arm.
# Arms: forecast_only (baseline), heuristic lam 500 ("heuristic wide"), PPO v2 (appo_async_s0/latest, "PPO wide").
# Participation levels via `--phase fireworks --levels 1.0,0.8,0.5,0.3` on the everyone-may-use-the-app runs.
name: coordinated_routing_fireworks_rule0_wide_newfc
seed: 0
network:
  segments: data/sf_citywide/batches/b3_main/export/segments.parquet
forecast:
  path: data/forecast/exports/b3_main_snapshot.parquet
env:
  batch: b6_fireworks
  splits: data/coordination/fireworks/splits.json
  history_s: 3600
  decision_window_s: 6300
  max_drain_s: 8100
  participation: 1.0
  max_participants: 100000
  compliance: 1.0
  forecast_mode: model
  forecast_checkpoint: data/forecast/experiments/event_patch_x_all/best.pt   # new 3-hour forecaster (top member of ens3)
  forecast_device: cpu
  warm_state_cache: true
  time_to_teleport_s: -1
  out_dir: data/coordination/fireworks_rule0_wide_newfc/episodes
  keep_outputs: false
rl:
  k: 5
  checkpoint: data/coordination/rl/runs_async/appo_async_s0/latest
  device: cpu
benchmark:
  policies:
  - forecast_only
  - heuristic@lam=500
  - rl_ppo
  checkpoints:
    rl_ppo: data/coordination/rl/runs_async/appo_async_s0/latest
  screening_split: val
  screening_scenarios: 3
  heldout_split: test
  heldout_scenarios: 6
  seeds:
  - 0
  - 1
  - 2
  batch_window_s: 60
  workers: 1
  out_dir: data/coordination/fireworks_rule0_wide_newfc
candidates:
  detour_abs_s: 300.0
  detour_rel: 0.25
  max_searches: 20

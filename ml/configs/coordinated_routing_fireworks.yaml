# July 4 fireworks exodus (demo/sumo kit v3, seed 42) on net_v3: eventsim/fireworks_demo.py builds b6_fireworks.
# Decision window 21:00-22:45 covers every app user; horizon 01:00 like the demo (drain 8100 s). Evaluation only
# (split test). participation applies to eligible trips: the 1000 app users in *_app runs, everyone in *_all.
name: coordinated_routing_fireworks
seed: 0
network:
  segments: data/sf_citywide/batches/b3_main/export/segments.parquet
forecast:
  path: data/forecast/exports/b3_main_snapshot.parquet
env:
  batch: b6_fireworks
  splits: data/coordination/fireworks/splits.json
  history_s: 3600
  decision_window_s: 6300
  max_drain_s: 8100
  participation: 1.0
  max_participants: 100000
  compliance: 1.0
  forecast_mode: model
  forecast_checkpoint: data/forecast/experiments/event_patch_v2_main/best.pt
  forecast_device: cpu
  warm_state_cache: true
  time_to_teleport_s: 300
  out_dir: data/coordination/fireworks/episodes
  keep_outputs: true      # the demo run: keep routes, edge data, SUMO summary (+ FCD with TP_FCD_PERIOD_S)
rl:
  k: 5
  checkpoint: data/coordination/rl/runs_main/ppo_s0/best
  device: cpu
benchmark:
  policies:
  - forecast_only
  - heuristic
  - heuristic@lam=500
  - heuristic@lam=2000
  checkpoints:
    rl_ppo: data/coordination/rl/runs_main/ppo_s0/best
    rl_ddqn: data/coordination/rl/runs_main/ddqn_s0/best
  screening_split: val
  screening_scenarios: 3
  heldout_split: test
  heldout_scenarios: 6
  seeds:
  - 0
  - 1
  - 2
  batch_window_s: 60
  workers: 1
  out_dir: data/coordination/fireworks
